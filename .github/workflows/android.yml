name: OrynLauncher APK

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_orynlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_orynlauncher/libs

      - name: Sanitize downloaded AAR native libraries
        run: |
          set -e
          shopt -s nullglob
          for aar in app_orynlauncher/libs/*.aar; do
            if unzip -l "$aar" | grep -q 'jni/out/libandroidx.graphics.path.so'; then
              echo "Removing malformed jni/out/libandroidx.graphics.path.so from $aar"
              tmpdir="$(mktemp -d)"
              unzip -q "$aar" -d "$tmpdir"
              rm -f "$tmpdir/jni/out/libandroidx.graphics.path.so"
              rm -rf "$tmpdir/jni/out" 2>/dev/null || true
              (cd "$tmpdir" && zip -qr "$OLDPWD/$(basename "$aar")" .)
              rm -rf "$tmpdir"
            fi
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_orynlauncher:bundleFullGplay
          mv app_orynlauncher/build/outputs/bundle/fullGplay/app_orynlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          : > out/build-debug.log

          build_status=1
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3" | tee -a out/build-debug.log
            gradle :app_orynlauncher:assembleFullDebug --stacktrace 2>&1 | tee -a out/build-debug.log
            build_status=${PIPESTATUS[0]}
            if [ "$build_status" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts." | tee -a out/build-debug.log
              exit "$build_status"
            fi
            echo "Transient build/download failure; retrying in 15 seconds..." | tee -a out/build-debug.log
            sleep 15
          done
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          mv app_orynlauncher/build/outputs/apk/full/debug/app_orynlauncher-full-debug.apk out/orynlauncher-x64armb.apk

      - name: Upload Debug Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orynlauncher-build-log
          path: out/build-debug.log
          retention-days: 7

      - name: Send Build Log to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ steps.debug_build.outcome }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 <<\x27PY\x27
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK is not configured; skipping Discord notification.")
              raise SystemExit(0)
          success = os.environ.get("BUILD_RESULT") == "success"
          emoji = "✅" if success else "❌"
          title = "OrynLauncher V4 Build Successful" if success else "OrynLauncher V4 Build Failed"
          try:
              with open("out/build-debug.log", "r", encoding="utf-8", errors="replace") as f: log = f.read()
          except FileNotFoundError:
              log = "Build log was not generated."
          log_tail = log[-1600:].replace("```", "'''").strip()
          message = (f"{emoji} **{title}**\n"
                     f"**Branch:** `{os.environ.get('BRANCH', 'unknown')}`\n"
                     f"**Commit:** `{os.environ.get('COMMIT', '')[:7]}`\n\n"
                     f"```text\n{log_tail}\n```\n"
                     f"**Full log:** <{os.environ.get('RUN_URL', '')}>")
          if len(message) > 1990: message = message[:1987] + "..."
          payload = {"username":"OrynLauncher Build Bot","content":message}
          request = urllib.request.Request(webhook, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response: print("Discord webhook response:", response.status)
          PY

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_orynlauncher:assembleNoruntimeDebug
          mv app_orynlauncher/build/outputs/apk/noruntime/debug/app_orynlauncher-noruntime-debug.apk out/orynlauncher-x64armb-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_orynlauncher:assembleFullPubRelease
          mv app_orynlauncher/build/outputs/apk/full/pubRelease/app_orynlauncher-full-pubRelease.apk out/MojoLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/orynlauncher-x64armb.apk > out/orynlauncher-x64armb.md5
          md5sum out/orynlauncher-x64armb-noruntime.apk > out/orynlauncher-x64armb-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orynlauncher-x64armb
          path: out/orynlauncher-x64armb.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: orynlauncher-x64armb-noruntime
          path: out/orynlauncher-x64armb-noruntime.apk

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoLauncher-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
