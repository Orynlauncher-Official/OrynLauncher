name: OrynLauncher APK

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_orynlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_orynlauncher/libs

      - name: Sanitize downloaded AAR native libraries
        run: |
          set -e
          shopt -s nullglob
          for aar in app_orynlauncher/libs/*.aar; do
            if unzip -l "$aar" | grep -q 'jni/out/libandroidx.graphics.path.so'; then
              echo "Removing malformed jni/out/libandroidx.graphics.path.so from $aar"
              tmpdir="$(mktemp -d)"
              unzip -q "$aar" -d "$tmpdir"
              rm -f "$tmpdir/jni/out/libandroidx.graphics.path.so"
              rm -rf "$tmpdir/jni/out" 2>/dev/null || true
              (cd "$tmpdir" && zip -qr "$OLDPWD/$(basename "$aar")" .)
              rm -rf "$tmpdir"
            fi
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_orynlauncher:bundleFullGplay
          mv app_orynlauncher/build/outputs/bundle/fullGplay/app_orynlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher. The bundled JRE8 asset is hosted on GitHub Releases
          # and can occasionally return a transient HTTP 500; retry the whole Gradle
          # invocation so the download task gets another chance.
          set -e
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"
            if gradle :app_orynlauncher:assembleFullDebug; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Transient build/download failure; retrying in 15 seconds..."
            sleep 15
          done
          mv app_orynlauncher/build/outputs/apk/full/debug/app_orynlauncher-full-debug.apk out/orynlauncher-x64armb.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_orynlauncher:assembleNoruntimeDebug
          mv app_orynlauncher/build/outputs/apk/noruntime/debug/app_orynlauncher-noruntime-debug.apk out/orynlauncher-x64armb-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_orynlauncher:assembleFullPubRelease
          mv app_orynlauncher/build/outputs/apk/full/pubRelease/app_orynlauncher-full-pubRelease.apk out/MojoLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app_OrynLauncherV4-Debug.apk > out/orynlauncher-x64armb.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orynlauncher-x64armb
          path: out/app_OrynLauncherV4-Debug.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: orynlauncher-x64armb-noruntime
          path: out/app-debug-noruntime.apk

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoLauncher-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
