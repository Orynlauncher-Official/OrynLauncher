name: Build OrynLauncher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653"
          
      - name: Verify NDK
        run: |
          ls -la "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          "$ANDROID_SDK_ROOT/ndk/25.2.9519653/ndk-build" --version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew :ZalithLauncher:assembleDebug -Darch=all --stacktrace

      - name: Find APK
        run: |
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrynLauncher-debug
          path: |
            ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
