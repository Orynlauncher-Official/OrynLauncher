plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'net.orynlauncher'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

loom {
    mixin {
        defaultRefmapName = 'orynlauncher-cosmetics-refmap.json'
    }
}
