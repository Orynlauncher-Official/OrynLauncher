<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrynLauncher Plus — Skin & Cape</title>
<style>
:root{color-scheme:dark;--bg:#030916;--panel:#07152a;--panel2:#0b1d38;--line:#18345b;--blue:#087cff;--blue2:#0754bd;--text:#f4f7ff;--muted:#8da9d5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 48% 0%,#0c2345 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid #102442;background:#030916eF;position:sticky;top:0;z-index:3}.back{height:42px;width:48px;border:1px solid var(--line);border-radius:14px;background:#091a32;color:#dceaff;font-size:24px}.logo{height:38px;width:38px;border-radius:12px;background:linear-gradient(145deg,#26a4ff,#0750d8);display:grid;place-items:center;font-weight:900;font-size:22px}.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}.brand span{color:#248cff}.right{margin-left:auto;color:#b4c9e8;display:flex;gap:17px;align-items:center}.status{color:#6fbaff}
main{max-width:1500px;margin:auto;padding:20px 24px 30px}.heading{display:flex;align-items:center;gap:15px;margin:0 0 16px}.person{width:62px;height:62px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0c203d,#061126);display:grid;place-items:center;font-size:28px}.heading h1{margin:0;font-size:30px;letter-spacing:-.8px}.heading p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(360px,.88fr) minmax(550px,1.2fr);gap:20px}.preview,.catalog{border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#07152aef,#030b19f7);box-shadow:0 18px 55px #0005}.preview{padding:18px;min-height:480px;display:flex;flex-direction:column}.badge{align-self:flex-start;background:#10294c;border:1px solid #1b3b68;border-radius:22px;padding:8px 13px;color:#bdd8ff}.stage{flex:1;min-height:300px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 57%,#0c2851 0,transparent 52%)}.orbit{position:absolute;width:64%;height:45px;border:2px solid #096bff;border-top-color:#12345d;border-radius:50%;bottom:48px;transform:rotate(-4deg);filter:drop-shadow(0 0 9px #087cff66)}.avatar{position:relative;width:130px;height:250px;transform:perspective(650px) rotateY(-14deg);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 14px 12px #0009)}.head{position:absolute;width:78px;height:78px;left:27px;top:0;background:linear-gradient(90deg,#161e2b 0 22%,#242d3c 22% 78%,#121b28 78%);border:3px solid #090f1a;box-shadow:inset 0 -14px #bd8068}.hair{position:absolute;left:25px;top:-3px;width:82px;height:32px;background:#161c27;border:3px solid #090f1a;clip-path:polygon(0 0,100% 0,100% 75%,72% 75%,72% 100%,53% 100%,53% 73%,33% 73%,33% 100%,15% 100%,15% 70%,0 70%)}.eyes{position:absolute;top:38px;left:41px;width:9px;height:7px;background:#e7f4ff;box-shadow:28px 0 #e7f4ff}.body{position:absolute;top:79px;left:15px;width:100px;height:102px;background:linear-gradient(90deg,#111823,#242d3b 50%,#101722);border:3px solid #090f1a;border-radius:5px 5px 2px 2px}.emblem{position:absolute;top:109px;left:49px;width:31px;height:31px;border:5px solid #f0f6ff;border-radius:7px;color:white;text-align:center;font-weight:900;line-height:21px;font-size:19px}.arm{position:absolute;top:84px;width:23px;height:93px;background:#171e2a;border:3px solid #090f1a}.arm.l{left:-7px;transform:rotate(3deg)}.arm.r{right:-7px;transform:rotate(-3deg)}.leg{position:absolute;top:178px;width:43px;height:65px;background:linear-gradient(#202a39 0 65%,#e4eaf3 65%);border:3px solid #090f1a}.leg.l{left:25px}.leg.r{right:25px}.previewname{text-align:center;font-size:21px;font-weight:750;margin:0}.sub{text-align:center;color:#81b7ff;margin:4px 0 14px}.model-switch{display:flex;border:1px solid var(--line);padding:4px;border-radius:17px;gap:4px}.model-switch button{flex:1;background:transparent;border:0;color:#93add7;border-radius:12px;padding:12px;font-weight:700;font-size:15px}.model-switch button.active{background:linear-gradient(110deg,#0966e8,#0747a5);color:#fff;box-shadow:inset 0 0 0 1px #3697ff}
.catalog{padding:14px;min-width:0}.tools{display:flex;gap:10px;margin-bottom:15px}.search{flex:1;min-width:100px;background:#07162c;border:1px solid #23436e;border-radius:15px;padding:0 14px;display:flex;align-items:center;gap:9px}.search span{font-size:21px;color:#80b9ff}.search input{width:100%;background:transparent;border:0;outline:0;color:#fff;padding:14px 0;font:inherit}.tabs{display:flex;background:#07162b;border:1px solid var(--line);border-radius:15px;padding:3px;min-width:240px}.tabs button{flex:1;border:0;border-radius:12px;background:transparent;color:#91add7;padding:10px;font:700 14px inherit;cursor:pointer}.tabs button.active{background:linear-gradient(110deg,#087bff,#0756ca);color:#fff;box-shadow:0 5px 15px #006dff38}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{border:1px solid #142d50;background:linear-gradient(145deg,#081a32,#050f20);border-radius:17px;min-width:0;padding:9px 8px 8px;text-align:center;position:relative;transition:.18s;cursor:pointer}.card:hover{border-color:#287fff;transform:translateY(-2px)}.card.selected{border:2px solid #0784ff;padding:8px 7px 7px;box-shadow:0 0 0 1px #087bff20}.tick{position:absolute;right:8px;top:7px;width:24px;height:24px;border-radius:50%;background:#087cff;display:grid;place-items:center;font-weight:900}.skinpic{height:67px;display:grid;place-items:center;font-size:47px;text-shadow:0 6px 12px #0009}.skinpic .cube{width:37px;height:43px;position:relative;background:var(--skin,#252c39);image-rendering:pixelated;box-shadow:inset -8px -8px #0004,inset 6px 4px #ffffff15;clip-path:polygon(17% 0,83% 0,100% 17%,100% 83%,83% 100%,17% 100%,0 83%,0 17%)}.cube:before{content:"";position:absolute;left:6px;right:6px;top:14px;height:5px;background:var(--eye,#cdeaff);box-shadow:15px 0 var(--eye,#cdeaff)}.cube:after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:5px;background:#080e18}.skinname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#e5eeff;margin:0 0 7px}.apply{width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,#0b3e86,#07316d);color:#eaf4ff;font-weight:700;padding:8px 3px;cursor:pointer}.apply:hover{background:linear-gradient(110deg,#087cff,#0752bd)}.import{margin-top:13px;width:100%;border:1px solid #1c3a63;border-radius:15px;padding:14px;background:linear-gradient(110deg,#10294b,#0b2140);color:#cfe3ff;font-weight:750;font-size:15px;cursor:pointer}.import:hover{border-color:#318bff}.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted);display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#0b2850;border:1px solid #277de7;border-radius:13px;padding:12px 18px;box-shadow:0 10px 35px #0008;transition:.25s;z-index:9}.toast.show{transform:translateX(-50%) translateY(0)}#file{display:none}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
@media(max-width:950px){.layout{grid-template-columns:1fr}.preview{min-height:450px}.catalog{min-width:0}}@media(max-width:560px){.top{padding:0 12px}.right{gap:8px;font-size:12px}.brand{font-size:17px}main{padding:16px 10px}.heading h1{font-size:24px}.layout{gap:12px}.preview{padding:12px}.catalog{padding:10px}.tools{flex-direction:column}.tabs{min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{min-height:290px}}
</style>
</head>
<body>
<header class="top"><button class="back" aria-label="Back" onclick="history.back()">‹</button><div class="logo">◈</div><div class="brand">OrynLauncher<span>Plus</span></div><div class="right"><span>◉</span><span>▶</span><span>◎</span><span class="status">⌁  ▥ 62%</span></div></header>
<main>
<section class="heading"><div class="person">♙</div><div><h1>Skin &amp; Cape</h1><p>Preview, select and apply your skins and capes</p></div></section>
<div class="layout">
<section class="preview"><div class="badge">◎ &nbsp; 3D Preview</div><div class="stage"><div class="avatar" id="avatar"><div class="head"></div><div class="hair"></div><div class="eyes"></div><div class="body"></div><div class="emblem">O</div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div><div class="orbit"></div></div><h2 class="previewname" id="previewname">Oryn</h2><div class="sub" id="modeltext">Classic Model (4px Arms) &nbsp;•&nbsp; Drag to Rotate</div><div class="model-switch"><button class="active" data-model="Classic">Classic</button><button data-model="Slim">Slim</button></div></section>
<section class="catalog"><div class="tools"><label class="search"><span>⌕</span><input id="search" placeholder="Search skins or capes..." autocomplete="off"></label><div class="tabs"><button class="active" data-tab="skins">♧ &nbsp; Skins</button><button data-tab="capes">♧ &nbsp; Capes</button></div></div><div class="grid" id="grid"></div><button class="import" id="import">⊞ &nbsp; Import / Replace Skin</button><input id="file" type="file" accept="image/png"><p style="color:#7695c2;font-size:11px;text-align:center;margin:10px 0 0">Preview prototype · applying to Minecraft requires launcher integration</p></section>
</div></main><div class="toast" id="toast"></div>
<script>
const skins=[
{name:"Oryn",color:"#202735",eye:"#f1f5ff",icon:"◈"},{name:"Steve Classic",color:"#75462c",eye:"#4ba7ff"},{name:"Alex Slim",color:"#d87925",eye:"#78caff"},{name:"Black Hoodie",color:"#10151e",eye:"#c8e4ff"},{name:"White Hoodie",color:"#dce3ef",eye:"#a8d9ff"},{name:"Glow",color:"#00cbe8",eye:"#52ffff"},{name:"Demon",color:"#42121c",eye:"#ff263c"},{name:"Anime Boy",color:"#202a3a",eye:"#f3f7ff"},{name:"Pink Girl",color:"#ed9ebd",eye:"#ffe5f0"},{name:"Purple Tech",color:"#5716a8",eye:"#d74dff"},{name:"Golden",color:"#bd8c16",eye:"#ffdf67"},{name:"Custom Skin",color:"#48606c",eye:"#b9e5ff"}];
const capes=[{name:"Oryn Blue",color:"#087cff",icon:"🟦"},{name:"Midnight",color:"#151b2a",icon:"⬛"},{name:"Frost",color:"#a6e5ff",icon:"🧊"},{name:"Royal Purple",color:"#772be7",icon:"🟪"},{name:"Crimson",color:"#b82239",icon:"🟥"},{name:"Emerald",color:"#16a66a",icon:"🟩"},{name:"Golden",color:"#d6a528",icon:"🟨"},{name:"Cloud",color:"#d8e5f6",icon:"⬜"}];
let tab="skins",selected="Oryn",model="Classic",customUrl=null;
const grid=document.querySelector("#grid"),search=document.querySelector("#search"),toast=document.querySelector("#toast");
function say(s){toast.textContent=s;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),2500)}
function render(){const data=(tab==="skins"?skins:capes).filter(x=>x.name.toLowerCase().includes(search.value.toLowerCase()));grid.innerHTML="";data.forEach(x=>{const c=document.createElement("article");c.className="card"+(selected===x.name?" selected":"");c.innerHTML='<div class="skinpic">'+(tab==="skins"?'<div class="cube" style="--skin:'+x.color+';--eye:'+x.eye+'"></div>':'<span>'+x.icon+'</span>')+'</div><div class="skinname"></div><button class="apply">'+(selected===x.name?"✓ Selected":"Apply")+'</button>';c.querySelector(".skinname").textContent=x.name;if(selected===x.name)c.insertAdjacentHTML("afterbegin",'<span class="tick">✓</span>');c.querySelector(".apply").onclick=e=>{e.stopPropagation();selected=x.name;document.querySelector("#previewname").textContent=x.name;if(tab==="skins"){document.querySelector(".head").style.background=x.color;document.querySelector(".body").style.background=x.color;document.querySelector(".hair").style.background=x.color;document.querySelector(".eyes").style.background=x.eye;document.querySelector(".eyes").style.boxShadow="28px 0 "+x.eye;document.querySelector(".emblem").textContent=x.name==="Oryn"?"O":"✦";say(x.name+" selected for preview");}else{say(x.name+" cape selected for preview");}render()};grid.appendChild(c)});if(!data.length)grid.innerHTML='<div class="empty" style="display:block">No matches found</div>';document.querySelector("#import").textContent=tab==="skins"?"⊞  Import / Replace Skin":"⊞  Import Cape (PNG)";document.querySelector("#file").accept="image/png"}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));search.placeholder="Search "+tab+"...";selected="";render()});
document.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{model=b.dataset.model;document.querySelectorAll("[data-model]").forEach(x=>x.classList.toggle("active",x===b));document.querySelector("#modeltext").textContent=(model==="Classic"?"Classic Model (4px Arms)":"Slim Model (3px Arms)")+"  •  Drag to Rotate";document.querySelectorAll(".arm").forEach(a=>a.style.width=model==="Slim"?"18px":"23px")});
search.addEventListener("input",render);document.querySelector("#import").onclick=()=>document.querySelector("#file").click();
document.querySelector("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.includes("png")){say("Please choose a PNG image");return}if(customUrl)URL.revokeObjectURL(customUrl);customUrl=URL.createObjectURL(f);if(tab==="skins"){const im=new Image();im.onload=()=>{const canvas=document.createElement("canvas");canvas.width=canvas.height=1;const ctx=canvas.getContext("2d");ctx.drawImage(im,0,0,1,1);const d=ctx.getImageData(0,0,1,1).data;document.querySelector(".body").style.background='rgb('+d[0]+','+d[1]+','+d[2]+')'};im.src=customUrl;document.querySelector("#previewname").textContent=f.name.replace(/\.png$/i,"");say("Skin imported for preview: "+f.name)}else say("Cape image selected: "+f.name+" (preview only)");};
let dragging=false,lastX=0,rot=-14;const avatar=document.querySelector("#avatar");avatar.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;avatar.setPointerCapture(e.pointerId)});avatar.addEventListener("pointermove",e=>{if(!dragging)return;rot+=(e.clientX-lastX)*.7;lastX=e.clientX;avatar.style.transform='perspective(650px) rotateY('+rot+'deg)'});avatar.addEventListener("pointerup",()=>dragging=false);avatar.addEventListener("pointercancel",()=>dragging=false);
render();
</script></body></html>
